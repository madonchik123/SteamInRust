name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Newer rustup refuses a host tuple in rust-toolchain.toml's channel; this
# picks the same GNU toolchain explicitly (it takes priority over the file).
env:
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  # PR titles become changelog lines and decide the next version
  # ("feat: …" = new feature, "fix: …" = bug fix), so check them.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            i18n
            ui
            docs
            chore
            ci
            refactor
            test

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW (the project uses the GNU toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Every merge into main: a test build (setup + portable zip) attached to
  # the workflow run for trying changes before a release. Not an update:
  # installed copies only update from published releases.
  preview:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-i686-gcc mingw-w64-i686-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Package
        shell: pwsh
        env:
          # 32-bit MinGW, so the setup includes steamclient32.dll for 32-bit games.
          SIR_MINGW32: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin
        run: cargo xtask package

      - uses: actions/upload-artifact@v7
        with:
          name: SteamInRust-preview-${{ github.sha }}
          path: target/package/dist/*
          retention-days: 14
