name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Newer rustup refuses a host tuple in rust-toolchain.toml's channel; this
# picks the same GNU toolchain explicitly (it takes priority over the file).
env:
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  # PR titles become changelog lines and decide the next version
  # ("feat: …" = new feature, "fix: …" = bug fix), so check them.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            i18n
            ui
            docs
            chore
            ci
            refactor
            test

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW (the project uses the GNU toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  # The same build and tests on macOS (Apple Silicon).
  test-macos:
    runs-on: macos-latest
    env:
      # rust-toolchain.toml names the Windows toolchain; use the Mac's own.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Steam Play: the Windows steamclient cross-built with MinGW still builds.
      - run: brew install mingw-w64
      - run: cargo xtask steamclient-win

  # Every merge into main: a test build (setup + portable zip) attached to
  # the workflow run for trying changes before a release. Not an update:
  # installed copies only update from published releases.
  preview:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-i686-gcc mingw-w64-i686-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Package
        shell: pwsh
        env:
          # 32-bit MinGW, so the setup includes steamclient32.dll for 32-bit games.
          SIR_MINGW32: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin
        run: cargo xtask package

      - uses: actions/upload-artifact@v4
        with:
          name: SteamInRust-preview-${{ github.sha }}
          path: target/package/dist/*
          retention-days: 14

  # The macOS disk image of the same merge.
  preview-macos:
    if: github.event_name == 'push'
    needs: test-macos
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # MinGW cross-builds the Windows steamclient for Steam Play.
      - run: brew install mingw-w64
      - run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: SteamInRust-preview-macos-${{ github.sha }}
          path: target/package/dist/*
          retention-days: 14
