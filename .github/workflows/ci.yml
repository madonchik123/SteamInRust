name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # PR titles become changelog lines and decide the next version
  # ("feat: …" = new feature, "fix: …" = bug fix), so check them.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            i18n
            ui
            docs
            chore
            ci
            refactor
            test

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW (the project uses the GNU toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Every merge into main: a test build (setup + portable zip) attached to
  # the workflow run for trying changes before a release. Not an update:
  # installed copies only update from published releases.
  preview:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SteamInRust-preview-${{ github.sha }}
          path: target/package/dist/*
          retention-days: 14
