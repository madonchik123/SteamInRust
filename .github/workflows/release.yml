# Push a tag like v0.2.0 (matching Cargo.toml) to build and publish a release:
# the setup, a portable zip and SHA256SUMS.txt (the app's updater checks it).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Newer rustup refuses a host tuple in rust-toolchain.toml's channel; this
# picks the same GNU toolchain explicitly (it takes priority over the file).
env:
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MinGW (the project uses the GNU toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Rust toolchain (GNU)
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $v" }

      - name: Test
        run: cargo test --workspace

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/package/dist/*
          body_path: docs/release-notes.md
          generate_release_notes: true

      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: SteamInRust
          path: target/package/dist/*
