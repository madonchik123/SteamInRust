"Steam needs your billing address before your first Market purchase. Finish this one on Steam's website." = "O Steam precisa do seu endereço de cobrança antes da primeira compra no Mercado. Conclua esta no site do Steam."
"Buy this item" = "Comprar este item"
"This item's price isn't in your wallet currency, so it can't be bought here." = "O preço não está na moeda da sua carteira, então não dá para comprar aqui."
"Seller receives" = "O vendedor recebe"
"Tax" = "Imposto"
"You pay" = "Você paga"
"Your wallet goes from {before} to {after}." = "Sua carteira vai de {before} para {after}."
"You have {balance} in your wallet, so you need {more} more." = "Você tem {balance} na carteira e precisa de mais {more}."
"Add funds on Steam" = "Adicionar fundos no Steam"
"This buys one item from the cheapest listing. Purchases on the Market can't be refunded." = "Compra um item do anúncio mais barato. Compras no Mercado não têm reembolso."
"Place a buy order" = "Criar uma ordem de compra"
"You already have a buy order for this item. Cancel it first to place a new one." = "Você já tem uma ordem para este item. Cancele-a antes de criar outra."
"Price per item" = "Preço por item"
"{n} × {price}" = "{n} × {price}"
"The most you can pay" = "O máximo que você paga"
"The lowest price Steam allows is {price}." = "O preço mínimo do Steam é {price}."
"Steam buys for you whenever someone sells at or below your price, until the quantity is reached or you cancel the order. Fees are included in your price." = "O Steam compra quando alguém vender pelo seu preço ou menos, até atingir a quantidade ou você cancelar. As taxas já estão incluídas."
"Place order, up to {price}" = "Criar ordem, até {price}"
"Turn into gems" = "Transformar em gemas"
"You lose" = "Você perde"
"The item is destroyed. This can't be undone." = "O item será destruído. Isso não pode ser desfeito."
"Destroy it for {gems}" = "Destruir por {gems}"
"Pack gems into sacks" = "Guardar gemas em sacos"
"Open sacks of gems" = "Abrir sacos de gemas"
"You need at least {gems} to fill a sack." = "Você precisa de pelo menos {gems} para encher um saco."
"Sacks" = "Sacos"
"You use" = "Você usa"
"{n} sacks of gems" = "{n} sacos de gemas"
"One sack holds 1,000 gems. You can pack or open sacks again later." = "Um saco tem 1.000 gemas. Você pode guardar ou abrir sacos de novo depois."
"Pack {n} sacks" = "Guardar {n} sacos"
"Open {n} sacks" = "Abrir {n} sacos"
"Make a booster pack" = "Criar um pacote"
"You spend" = "Você gasta"
"Gems left" = "Gemas restantes"
"Only your tradable gems are used, so the pack can be traded." = "Só gemas negociáveis são usadas, então o pacote poderá ser trocado."
"You get one booster pack of three cards. You can make one pack for this game each day. Gems spent can't be returned." = "Você recebe um pacote com três cartas. Dá para criar um por dia para este jogo. Gemas gastas não voltam."
"Spend {gems}" = "Gastar {gems}"
"Open booster pack" = "Abrir pacote"
"The pack is used up and you get three trading cards. This can't be undone." = "O pacote é usado e você recebe três cartas colecionáveis. Isso não pode ser desfeito."
"Open pack" = "Abrir pacote"
"Add gift to your library" = "Adicionar presente à biblioteca"
"Keep gift in your inventory" = "Manter presente no inventário"
"The gift becomes part of your account for good. It can't be traded or given to anyone else afterwards." = "O presente passa a fazer parte da sua conta para sempre. Depois não pode ser trocado nem dado a outra pessoa."
"The gift moves to your inventory. You can add it to your library later." = "O presente vai para o seu inventário. Você pode adicioná-lo à biblioteca depois."
"Keep in inventory" = "Manter no inventário"
"Decline this gift" = "Recusar este presente"
"{name} gets the gift back, and you can't accept it afterwards." = "{name} recebe o presente de volta, e você não poderá mais aceitá-lo."
"A note to them (optional)" = "Uma mensagem para a pessoa (opcional)"
"Decline gift" = "Recusar presente"
"Your new cards" = "Suas novas cartas"
"Foil" = "Metálica"
"Steam didn't answer, so this may or may not have gone through. Check your Market history and wallet before trying again." = "O Steam não respondeu, então isso pode ou não ter sido concluído. Veja seu histórico do Mercado e a carteira antes de tentar de novo."
"Steam didn't share your wallet details. Try again, or buy on Steam's website." = "O Steam não informou os dados da sua carteira. Tente de novo ou compre no site do Steam."
"The approval in the Steam Mobile app was declined or ran out of time." = "A aprovação no Steam Mobile foi recusada ou expirou."
"Steam didn't accept the buy order." = "O Steam não aceitou a ordem de compra."
"Steam couldn't complete the purchase. The item may already be sold." = "O Steam não conseguiu concluir a compra. O item pode já ter sido vendido."
"Still waiting for your approval. If you approve it in the Steam Mobile app it can still go through, so deny it there if you changed your mind." = "Ainda aguardando sua aprovação. Se você aprovar no Steam Mobile, ainda pode ser concluído; recuse lá se mudou de ideia."
"This listing's price isn't in your wallet currency. Open it again to get a fresh price." = "O preço não está na moeda da sua carteira. Abra de novo para atualizar."
"Steam didn't say what this item is worth in gems." = "O Steam não informou quantas gemas este item vale."
"Steam didn't turn this item into gems." = "O Steam não transformou o item em gemas."
"That amount doesn't divide into whole sacks." = "Essa quantidade não forma sacos inteiros."
"You don't have enough gems for that." = "Você não tem gemas suficientes para isso."
"Steam didn't exchange your gems." = "O Steam não trocou suas gemas."
"Couldn't read Steam's booster pack page." = "Não foi possível ler a página de pacotes do Steam."
"Steam couldn't make this booster pack right now." = "O Steam não pode criar este pacote agora."
"Steam couldn't open this booster pack. It may already be open." = "O Steam não conseguiu abrir o pacote. Ele pode já estar aberto."
"Steam couldn't accept this gift. It may already have been redeemed." = "O Steam não conseguiu aceitar o presente. Ele pode já ter sido resgatado."
"Steam couldn't decline this gift. It may already have been answered." = "O Steam não conseguiu recusar o presente. Talvez já tenha sido respondido."
"The Market is busy. Try again in a minute." = "O Mercado está ocupado. Tente de novo em um minuto."
