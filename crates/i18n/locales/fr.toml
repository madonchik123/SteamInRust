"Opened in your browser" = "Ouvert dans le navigateur"
"Use DXVK for DirectX 10 and 11 games" = "Utiliser DXVK pour les jeux DirectX 10 et 11"
"Most DirectX 11 games need it to start with Wine. It's downloaded once (3 MB) the first time a game starts. CrossOver has its own and doesn't use it." = "La plupart des jeux DirectX 11 en ont besoin pour démarrer avec Wine. Il est téléchargé une fois (3 Mo) au premier lancement d'un jeu. CrossOver a le sien et ne l'utilise pas."
