[package]
name = "steamclient"
description = "Replacement for Steam's steamclient64.dll: gives games started by SteamInRust the signed-in user, stats, achievements and cloud files"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# steam_api64.dll loads this by full path (see client::launch); the file
# name doesn't matter, the exports do.
crate-type = ["cdylib", "rlib"]

[dependencies]
image.workspace = true
vdf.workspace = true
serde.workspace = true
serde_json.workspace = true

# The in-game overlay (src/overlay): D3D11 drawing and input inside the game.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
