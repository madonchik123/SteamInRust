[package]
name = "client"
description = "High-level Steam session: login, presence, friends, owned library, game launching"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
net.workspace = true
auth.workspace = true
proto.workspace = true
vdf.workspace = true
model.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
prost.workspace = true
image.workspace = true
reqwest.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
thiserror.workspace = true
tracing.workspace = true
depot.workspace = true
futures-util.workspace = true
rand.workspace = true
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = "1"
# Saved sign-ins: the refresh token and Steam Guard data live in the OS
# credential store (Secret Service on Linux, Credential Manager on Windows,
# Keychain on macOS), never in a file.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
# Finding where a game is installed (Workshop downloads).
local.workspace = true

[target.'cfg(windows)'.dependencies]
# Install scripts: the registry (Steam's HasRunKey values) and an elevated
# helper for installers that need an administrator.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tracing-subscriber.workspace = true
