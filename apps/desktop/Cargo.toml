[package]
name = "steam-rs"
description = "A native Steam client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "steam-rs"
path = "src/main.rs"

[dependencies]
client.workspace = true
extensions.workspace = true
plugins.workspace = true
store.workspace = true
video.workspace = true
local.workspace = true
model.workspace = true
ui.workspace = true
i18n.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
fs4 = "1"
qrcode.workspace = true
rand.workspace = true
global-hotkey.workspace = true
tray-icon.workspace = true
rfd = "0.18"
# Game controllers for Big Picture (Windows, macOS and Linux).
gilrs = "0.11"
open.workspace = true
directories.workspace = true
sha2 = "0.10"
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# macOS: receiving steam:// links (Apple Events), already in the build through winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# Gaming_Input: to notice a controller being plugged in; Shell + Com: download
# progress on the taskbar button.
windows = { version = "0.62", features = ["Gaming_Input", "Foundation_Collections", "Win32_UI_Shell", "Win32_System_Com"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Reads settings the way eframe saves them (tests).
ron = "0.12"
